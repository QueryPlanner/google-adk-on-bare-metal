version: 2

# These limits apply to version-update pull requests only.
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 4
    # Keep breaking upgrades and incompatible OTel lines as explicit work.
    # These update-type filters do not apply to security-only update jobs.
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
      # Remove when the supported LiteLLM range no longer pins Pydantic to 2.12.5.
      - dependency-name: "pydantic"
        update-types:
          - "version-update:semver-patch"
          - "version-update:semver-minor"
      - dependency-name: "opentelemetry-exporter-gcp-logging"
        update-types:
          - "version-update:semver-minor"
      - dependency-name: "opentelemetry-exporter-otlp-proto-http"
        update-types:
          - "version-update:semver-minor"
      - dependency-name: "opentelemetry-instrumentation-logging"
        update-types:
          - "version-update:semver-minor"
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 3
    # Validate action major upgrades deliberately in their own pull requests.
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    commit-message:
      prefix: "ci(deps)"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    exclude-paths:
      - "compose.yaml"
    # The application and test matrix currently support Python 3.13 only.
    ignore:
      - dependency-name: "python"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"
    commit-message:
      prefix: "build(deps)"

  # Track the optional pinned Collector overlay on the same weekly cadence.
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 1
    commit-message:
      prefix: "build(deps)"
